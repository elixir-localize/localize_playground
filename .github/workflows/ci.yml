name: Elixir CI

# This is a demo application, not a published library, so it runs on the
# single canonical toolchain rather than the full Elixir/OTP matrix. Its job
# is to catch a dependency bump that breaks the playground.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  LOCALIZE_DEFAULT_LOCALE: en

permissions:
  contents: read

jobs:
  test:
    name: "Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.20.4-otp-29"
            otp: "29"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependency cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      # calendrical pulls in astro, which needs the ~32 MB JPL DE440s ephemeris
      # at compile time and lazily downloads it from NAIF otherwise. NAIF is
      # slow and periodically unreachable, so cache the file and fetch it
      # explicitly with retries. The key is constant because the file never
      # changes; bump it if the ephemeris is ever replaced.
      - name: Restore JPL ephemeris
        id: astro-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/astro
          key: astro-ephemeris-de440s

      - name: Download JPL ephemeris
        if: steps.astro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/astro
          url="https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp"
          # NAIF advertises TLS 1.3 but its handshake is broken, so cap at 1.2.
          for i in 1 2 3 4 5; do
            if curl --fail --location --tls-max 1.2 --connect-timeout 30 \
                    --output ~/.cache/astro/de440s.bsp "$url"; then
              exit 0
            fi
            echo "Ephemeris download attempt $i failed; retrying in 20s..."
            sleep 20
          done
          echo "Ephemeris download failed after 5 attempts" >&2
          exit 1

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
